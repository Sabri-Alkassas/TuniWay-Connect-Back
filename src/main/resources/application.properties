server.port=${SERVER_PORT:}
spring.config.import=optional:file:.env[.properties]
spring.application.name=tuniway-connect-back
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# SMTP (Gmail)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:}

# JWT
app.jwt.secret=${JWT_SECRET:C_H_A_Z_4_R_S_E_C_R_E_T_2_0_2_6_!}
app.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXP_MINUTES:15}
